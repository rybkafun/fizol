<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park Drgań</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Układ: jedna kolumna, jedna rzecz naraz; mapa misji jako pionowa ścieżka.
   Paleta: mglista szałwia + głęboki morski + morela; spokojna, nienasycona. */
:root{
  --bg:#ECEFEA; --surface:#FBFBF8; --surface2:#F1F4EF; --ink:#1E272B; --muted:#53606A; --line:#C9D3CD;
  --primary:#2D6669; --primary-ink:#FFFFFF; --primary-soft:#D5E7E4;
  --accent:#DB915A; --accent-soft:#F6E2CF; --rose:#C97F86; --lilac:#7E6DB8; --lilac-soft:#E5E0F3;
  --ok:#2F7D4D; --ok-soft:#DCEFE2; --hint:#875B0C; --hint-soft:#FAEED3;
  --tika:#86BDB4; --tika-dark:#4E8D85; --focus:#7A67C2;
  --shadow:0 1px 2px rgba(30,39,43,.06),0 6px 18px rgba(30,39,43,.07);
  --font:"Atkinson Hyperlegible","Lexend","Verdana","Segoe UI",system-ui,sans-serif;
  --scale:1; --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A1D; --surface:#1D2529; --surface2:#253035; --ink:#ECEFEA; --muted:#A9B5B3; --line:#3A4A51;
  --primary:#7CC0BE; --primary-ink:#0F1A1C; --primary-soft:#22403F;
  --accent:#EFB07A; --accent-soft:#45321F; --rose:#E3A0A6; --lilac:#B3A5E0; --lilac-soft:#2E2944;
  --ok:#86D19F; --ok-soft:#1E3628; --hint:#EBC572; --hint-soft:#3A3020;
  --tika:#6FA9A1; --tika-dark:#4B8079; --focus:#B3A5E0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A1D; --surface:#1D2529; --surface2:#253035; --ink:#ECEFEA; --muted:#A9B5B3; --line:#3A4A51;
  --primary:#7CC0BE; --primary-ink:#0F1A1C; --primary-soft:#22403F;
  --accent:#EFB07A; --accent-soft:#45321F; --rose:#E3A0A6; --lilac:#B3A5E0; --lilac-soft:#2E2944;
  --ok:#86D19F; --ok-soft:#1E3628; --hint:#EBC572; --hint-soft:#3A3020;
  --tika:#6FA9A1; --tika-dark:#4B8079; --focus:#B3A5E0; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
/* Wysoki kontrast: teksty pomocnicze i linie w kolorze tekstu */
:root[data-contrast="high"]{--muted:var(--ink); --line:var(--ink)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(17px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;letter-spacing:.012em;word-spacing:.04em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1{font-size:1.65rem;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.28rem;line-height:1.3;margin:0;text-wrap:balance}
h3{font-size:1.08rem;margin:0}
p{margin:0}
ul,ol{margin:0;padding-left:1.3rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* ---------- pasek górny ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:.55rem;min-height:3.7rem}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:1.05rem}
.brand span{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:2.9rem;height:2.9rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.iconbtn[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .75rem;border-radius:999px;background:var(--accent-soft);font-weight:700;font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.ic{display:inline-block;width:1.35em;height:1.35em;flex:none;vertical-align:-.28em}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill svg{fill:currentColor;stroke:none}

main{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:1.25rem 4rem;display:flex;flex-direction:column;gap:1.1rem}
main:focus{outline:none}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;gap:.6rem;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:.8rem}
.card{background:var(--surface);border-radius:var(--r);padding:1.2rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.9rem;min-width:0}

/* ---------- przyciski ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3rem;padding:.65rem 1.25rem;border-radius:999px;
  border:2px solid transparent;font-weight:700;cursor:pointer;text-align:center;line-height:1.2}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.soft{background:var(--primary-soft)}
.btn.big{min-height:3.6rem;font-size:1.15rem;padding-inline:1.8rem}
.btn:disabled{opacity:.45;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px)}
.toggle{border-radius:999px;border:2px solid var(--line);background:var(--surface);padding:.5rem 1rem;font-weight:700;min-height:2.75rem;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end}

/* ---------- przewodniczka Tika ---------- */
.say{display:flex;gap:.7rem;align-items:flex-end}
.tika{width:62px;height:74px;flex:none}
.tika-arm{transform-box:view-box;transform-origin:40px 70px;animation:tick 1.3s ease-in-out infinite alternate}
@keyframes tick{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.bubble{background:var(--surface);border-radius:18px 18px 18px 5px;padding:.8rem 1rem;box-shadow:var(--shadow);font-size:1.05rem;min-width:0;flex:1}
body.focus .tika,body.focus .deco{display:none}
body.focus .bubble{border-radius:14px}
body.noanim .tika-arm{animation:none}

/* ---------- mapa ---------- */
.progress{height:12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.8rem;position:relative}
.path::before{content:"";position:absolute;left:calc(1rem + 1.4rem);top:1.5rem;bottom:1.5rem;border-left:3px dashed var(--line)}
.node{position:relative;display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r);padding:.85rem 1rem;cursor:pointer;min-height:4.4rem}
.node .num{width:2.8rem;height:2.8rem;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:1.1rem;background:var(--primary-soft);color:var(--ink)}
.node .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.node .txt b{font-size:1.05rem}
.node .txt span{font-size:.85rem;color:var(--muted)}
.node.done .num{background:var(--ok-soft);color:var(--ok)}
.node.next{border-color:var(--primary);box-shadow:var(--shadow)}
.node.locked{opacity:.55;cursor:not-allowed}
.stars{display:inline-flex;gap:2px;color:var(--accent)}
.stars .off{color:var(--line)}
.tag-next{font-size:.72rem;font-weight:700;background:var(--primary);color:var(--primary-ink);border-radius:999px;padding:.1rem .55rem;align-self:flex-start;margin-bottom:.15rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:.7rem}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);
  padding:.95rem;cursor:pointer;min-height:7rem}
.mode .ic{width:1.8rem;height:1.8rem;color:var(--primary)}
.mode b{font-size:1rem}
.mode span{font-size:.84rem;color:var(--muted);line-height:1.35}
.count-badge{background:var(--accent-soft);border-radius:999px;padding:0 .5rem;font-weight:700;font-size:.8rem}
.sec{margin-top:.6rem}

/* ---------- misja ---------- */
.stepbar{display:flex;gap:4px}
.stepbar span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.stepbar span.d{background:var(--primary)}
.stepbar span.c{background:var(--accent)}
.sim{display:block;width:100%;height:clamp(230px,42vh,370px);background:var(--surface2);border-radius:var(--r);border:1px solid var(--line);touch-action:manipulation}
.sim.mini{height:clamp(170px,28vh,240px)}
.readout{font-weight:700;font-variant-numeric:tabular-nums;padding:.55rem .85rem;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.digits{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.goal{background:var(--ok-soft);border-radius:12px;padding:.65rem .9rem;font-weight:700}
.sl{display:flex;flex-direction:column;gap:.1rem}
.sl .row{justify-content:space-between}
.sl output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.75rem;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--primary);border:4px solid var(--surface);box-shadow:0 0 0 2px var(--primary);margin-top:-10px}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--primary);border:4px solid var(--surface)}
input[type=range]:disabled{opacity:.6}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.82rem;color:var(--muted)}
.ebar{display:grid;grid-template-columns:minmax(6.5rem,auto) 1fr 3.2rem;gap:.6rem;align-items:center}
.ebar .track{height:1.15rem;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.ebar .fill{height:100%;border-radius:999px}
.ebar output{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap}
.tabs [role=tab]{border-radius:999px;border:2px solid var(--line);background:var(--surface);padding:.5rem 1.1rem;font-weight:700;cursor:pointer;min-height:2.75rem}
.tabs [role=tab][aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chal{background:var(--lilac-soft);border-radius:14px;padding:.85rem 1rem;display:flex;flex-direction:column;gap:.6rem}
.chal p{font-weight:700}

/* ---------- zadania ---------- */
.qmeta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.85rem;color:var(--muted)}
.tag{background:var(--lilac-soft);color:var(--ink);border-radius:999px;padding:.15rem .65rem;font-weight:700}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.qtext{font-size:1.3rem}
.qtext:focus{outline:none}
.qbody{display:flex;flex-direction:column;gap:.8rem;min-width:0}
.opts{display:grid;gap:.6rem}
.opt{display:flex;gap:.75rem;align-items:center;text-align:left;min-height:3.3rem;padding:.75rem 1rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.05rem}
.optkey{width:1.8rem;height:1.8rem;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.85rem;font-weight:700;flex:none}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.tried{opacity:.5;border-style:dashed}
.opt.right{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.opt:disabled{cursor:default}
.tfrow{grid-template-columns:1fr 1fr}
.note{font-size:.9rem;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.mcol{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.mitem{position:relative;text-align:left;padding:.65rem .8rem .65rem .8rem;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:3.1rem;font-size:.97rem;line-height:1.35}
.mitem.sel{border-color:var(--focus);background:var(--lilac-soft)}
.mitem[data-n]{border-color:var(--pc);padding-right:2.2rem}
.mitem[data-n]::after{content:attr(data-n);position:absolute;right:.45rem;top:50%;transform:translateY(-50%);width:1.45rem;height:1.45rem;border-radius:50%;background:var(--pc);color:var(--surface);font-size:.8rem;font-weight:700;display:grid;place-items:center}
.mitem.bad{border-style:dashed}
.slot-line{font-size:1.15rem;line-height:2.8}
.formula .slot-line{font-size:1.7rem;text-align:center;font-weight:700}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:5.2rem;min-height:2.6rem;padding:0 .7rem;margin:0 .2rem;vertical-align:middle;border:2px dashed var(--primary);border-radius:10px;background:var(--surface2);font-weight:700;cursor:pointer;line-height:1.2}
.formula .slot{min-width:3.4rem;min-height:3.2rem;font-size:1.6rem}
.slot.filled{border-style:solid;background:var(--primary-soft)}
.slot.hover{background:var(--lilac-soft);border-color:var(--focus)}
.slot.bad{border-color:var(--rose)}
.slot.revealed{border-color:var(--ok);background:var(--ok-soft)}
.bank{display:flex;flex-wrap:wrap;gap:.55rem;padding:.75rem;border-radius:14px;background:var(--surface2);border:1px solid var(--line);min-height:3.8rem}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;border:2px solid var(--ink);background:var(--surface);padding:.45rem .9rem;font-weight:700;cursor:grab;min-height:2.7rem;font-size:1.05rem}
.chip.dragging{opacity:.35}
.chip.ghost{position:fixed;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);z-index:100;box-shadow:var(--shadow)}
.svgwrap{background:var(--surface2);border-radius:var(--r);border:1px solid var(--line);padding:.4rem}
.qsvg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.svg-lbl{fill:var(--ink);font:700 15px var(--font)}
.hot{cursor:pointer}
.hot:focus{outline:none}
.hot:focus-visible .hot-shape,.hot:hover .hot-shape{stroke:var(--focus)!important;stroke-width:4px!important}
.hot.sel .hot-shape{stroke:var(--focus)!important;stroke-width:6px!important}
.hot.tried{opacity:.4}
.hot.right .hot-shape{stroke:var(--ok)!important;stroke-width:6px!important}
.calc-data{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;background:var(--surface2);border-radius:12px;padding:.75rem 1rem;font-variant-numeric:tabular-nums}
.calc-data dt{font-weight:700;color:var(--muted)}
.calc-data dd{margin:0}
.lbl{font-weight:700}
.numin{font:inherit;font-size:1.25rem;font-weight:700;width:9rem;max-width:100%;min-height:3rem;padding:.4rem .7rem;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.numin:focus{border-color:var(--primary)}
.numin.okv{border-color:var(--ok);background:var(--ok-soft)}
.choice{border-radius:10px;border:2px solid var(--line);background:var(--surface);padding:.45rem .85rem;font-weight:700;cursor:pointer;min-height:2.75rem}
.choice[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.helpbox{background:var(--hint-soft);border-radius:14px;padding:.85rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.hb-t{font-weight:700;color:var(--hint)}
.feedback:empty{display:none}
.feedback{border-radius:14px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.45rem}
.fb-ok{background:var(--ok-soft)}
.fb-hint{background:var(--hint-soft)}
.fb-learn{background:var(--lilac-soft)}
.fb-t{font-weight:700;font-size:1.1rem}
.pts{font-weight:700;color:var(--ok)}
.qactions{display:flex;gap:.6rem;justify-content:space-between;flex-wrap:wrap}
.qactions .btn.primary{margin-left:auto}
.qcard{position:relative}
.burst{position:absolute;right:2.2rem;top:1.2rem;pointer-events:none;width:0;height:0}
.burst i{position:absolute;width:12px;height:12px;background:var(--accent);clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);animation:fly 1s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
body.noanim .burst{display:none}

/* ---------- podsumowania, kolekcja ---------- */
.bigstars{display:flex;gap:.4rem;color:var(--accent);justify-content:center}
.bigstars .ic{width:3rem;height:3rem}
.bigstars .off{color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:.6rem}
.stat{background:var(--surface2);border-radius:14px;padding:.7rem .9rem;display:flex;flex-direction:column}
.stat b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:.6rem}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.3rem;padding:.8rem .6rem;border-radius:14px;background:var(--surface2);border:2px solid var(--line)}
.badge .medal{width:3rem;height:3rem;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.badge .medal .ic{width:1.7rem;height:1.7rem}
.badge b{font-size:.92rem;line-height:1.25}
.badge span{font-size:.78rem;color:var(--muted);line-height:1.3}
.badge.locked{opacity:.5}
.badge.locked .medal{background:var(--surface);color:var(--muted)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr));gap:.6rem}
.skin{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.6rem;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:.85rem;text-align:center}
.skin canvas{width:64px;height:64px}
.skin[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.skin:disabled{opacity:.5;cursor:default}
.chips-list{display:flex;flex-wrap:wrap;gap:.4rem}
.cchip{border-radius:999px;padding:.25rem .75rem;font-size:.9rem;font-weight:700}
.cchip.good{background:var(--ok-soft)}
.cchip.rev{background:var(--hint-soft)}
.mlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.5rem}
.mlist li{background:var(--surface2);border-radius:12px;padding:.65rem .85rem;display:flex;flex-direction:column;gap:.1rem}
.mlist li span{font-size:.82rem;color:var(--muted)}

/* ---------- przerwa ---------- */
.breath{width:min(220px,60vw);aspect-ratio:1;max-width:100%;border-radius:50%;margin:1rem auto;display:grid;place-items:center;
  background:radial-gradient(circle,var(--primary-soft) 0 55%,var(--surface2) 56%);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
body:not(.noanim) .breath{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.88)}50%{transform:scale(1.05)}}

/* ---------- ustawienia (panel) ---------- */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(15,22,25,.45);display:flex;justify-content:center;align-items:flex-end;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:1.2rem max(16px,1.2rem) calc(1.4rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1rem}
@media (min-width:640px){#overlay{align-items:center}.sheet{border-radius:22px}}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-block:.35rem;border-bottom:1px solid var(--line)}
.setrow>div{min-width:0}
.setrow small{display:block;color:var(--muted);font-size:.82rem}
.switch{width:3.5rem;height:2.05rem;border-radius:999px;background:var(--line);position:relative;border:none;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:.27rem;left:.27rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(1.45rem)}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{border-radius:999px;border:2px solid var(--line);background:var(--surface);padding:.35rem .8rem;font-weight:700;cursor:pointer;min-height:2.6rem}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* ---------- powiadomienia ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:.5rem;z-index:60;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--surface);border-radius:14px;padding:.7rem 1.1rem;font-weight:700;box-shadow:var(--shadow);max-width:100%;display:flex;gap:.5rem;align-items:center}
body:not(.noanim) .toast{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* ---------- ściągawka ---------- */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:.8rem}
.cheat section{background:var(--surface);border-radius:14px;padding:1rem 1.1rem;border:1px solid var(--line);display:flex;flex-direction:column;gap:.5rem;min-width:0}
.cheat dl{margin:0;display:flex;flex-direction:column;gap:.35rem}
.cheat dt{font-weight:700}
.cheat dd{margin:0 0 .2rem;color:var(--muted)}
.fml{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline;border-bottom:1px dashed var(--line);padding-block:.3rem;flex-wrap:wrap}
.fml b{font-size:1.25rem;white-space:nowrap}
.fml span{font-size:.85rem;color:var(--muted)}
.cheat .wide{grid-column:1/-1}

body.noanim *,body.noanim *::before,body.noanim *::after{transition:none!important}
@media (prefers-reduced-motion:reduce){.tika-arm,.breath,.toast,.burst i{animation:none!important}}
@media print{
  .topbar,.no-print,#toasts,#overlay{display:none!important}
  body{background:#fff;color:#000}
  main{max-width:none;padding:0}
  .cheat section{break-inside:avoid;border:1px solid #888}
  .cheat dd,.fml span{color:#333}
}
</style>

<script>
'use strict';
/* =====================================================================
   PARK DRGAŃ – gra edukacyjna z fizyki (kl. 8)
   Struktura kodu:
   1. Narzędzia            5. Rysowanie (canvas, SVG)
   2. Zapis i stan gry     6. Silnik zadań (typy zadań)
   3. Dźwięk               7. Ekrany (mapa, misja, testy, ...)
   4. Pętla animacji       8. MODUŁY FIZYKI (dane + eksperymenty)
   Nowy moduł dodajesz funkcją registerModule({...}) – patrz sekcja 8.
   ===================================================================== */
document.documentElement.lang = 'pl';

/* ===== 1. NARZĘDZIA ===== */
const $ = (s, r = document) => r.querySelector(s);
// Tworzenie elementów: h('button', {class:'btn', onclick: fn}, 'Tekst')
function h(tag, attrs, ...kids) {

    const v = attrs[k];

    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v === true ? '' : v);

  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const rnd = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// Liczby po polsku: przecinek dziesiętny
function fmt(x, d = 3) { const r = Math.round(x * 10 ** d) / 10 ** d; return String(r).replace('.', ','); }
// Odczyt liczby wpisanej przez ucznia: akceptuje przecinek, kropkę, spacje, jednostkę na końcu i ułamek a/b
function parseNum(s) {

  s = String(s).trim().toLowerCase().replace(/\s+/g, '').replace(/,/g, '.');
  const m = s.match(/^([-+]?\d*\.?\d+)(?:\/(\d*\.?\d+))?/);
  if (!m) return NaN;
  let v = parseFloat(m[1]); if (m[2]) v /= parseFloat(m[2]);

}
// Odmiana: 1 pełne drganie, 2 pełne drgania, 5 pełnych drgań
function pelne(n) {
  const n10 = n % 10, n100 = n % 100;
  if (n === 1) return '1 pełne drganie';
  if (n10 >= 2 && n10 <= 4 && !(n100 >= 12 && n100 <= 14)) return n + ' pełne drgania';
  return n + ' pełnych drgań';
}
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function dayDiff(a, b) { const p = a.split('-').map(Number), q = b.split('-').map(Number); return Math.round((Date.UTC(q[0], q[1] - 1, q[2]) - Date.UTC(p[0], p[1] - 1, p[2])) / 864e5); }
const isTyping = e => e.target && e.target.matches && e.target.matches('input[type=text],input:not([type]),textarea,select');

/* ===== 2. ZAPIS I STAN GRY ===== */
const STORE_KEY = 'parkDrgan.v1';
const Store = {
  ok: true,
  load() { try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { this.ok = false; return null; } },
  save(d) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) { this.ok = false; } }
};
function defaults() {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  return {
    v: 1, modId: 'drgania', points: 0, stars: {}, done: {}, badges: {}, mistakes: {}, flags: {},
    fixed: 0, calcOk: 0, measurements: 0, answered: 0, sessions: 0, skin: 'klasyk', skinsSeen: {},
    streak: { last: null, count: 0, best: 0, days: 0 },
    settings: { sound: false, volume: 0.5, anim: !reduce, focus: false, scale: 1, contrast: false, theme: 'auto', difficulty: 2, unlockAll: false }
  };
}
function merge(def, src) {
  if (!src || typeof src !== 'object') return def;
  for (const k in def) {
    if (def[k] && typeof def[k] === 'object' && !Array.isArray(def[k])) def[k] = merge(def[k], src[k]);
    else if (src[k] !== undefined) def[k] = src[k];
  }
  for (const k in src) if (!(k in def)) def[k] = src[k];
  return def;
}
let S = merge(defaults(), Store.load());
const persist = () => Store.save(S);

// Seria dni: przerwa jednego dnia NIE przerywa serii; dłuższa przerwa – seria zaczyna się od nowa, bez kary
function updateStreak() {
  const t = todayStr(), st = S.streak;
  if (st.last === t) return null;
  let msg;
  if (!st.last) { st.count = 1; msg = 'first'; }
  else {
    const d = dayDiff(st.last, t);
    if (d >= 1 && d <= 2) { st.count++; msg = d === 2 ? 'grace' : 'cont'; }
    else { st.count = 1; msg = 'back'; }
  }
  st.days++; st.last = t; st.best = Math.max(st.best, st.count);
  persist();
  return msg;
}

/* ===== 3. DŹWIĘK (Web Audio, cicho i łagodnie, domyślnie wyłączony) ===== */
const Sound = {
  ctx: null,
  play(kind) {
    if (!S.settings.sound) return;
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
      const ctx = this.ctx; if (ctx.state === 'suspended') ctx.resume();
      // Brak dźwięku "porażki" – tylko miękkie, wznoszące się tony
      const seq = { ok: [523.25, 659.25], good: [659.25, 783.99], badge: [523.25, 659.25, 783.99], tap: [392], push: [261.6], done: [392, 523.25, 659.25, 783.99] }[kind] || [440];
      const vol = 0.05 * S.settings.volume * (kind === 'tap' ? 0.5 : 1);
      seq.forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t0 = ctx.currentTime + i * 0.12;
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
        o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + 0.45);
      });
    } catch (e) { /* brak dźwięku nie przeszkadza w grze */ }
  }
};

/* ===== 4. PĘTLA ANIMACJI I SPRZĄTANIE EKRANÓW ===== */
// Każda animacja jest przypięta do elementu – gdy element znika ze strony, animacja sama się wyłącza.
const Loop = {
  items: new Set(), raf: 0, last: 0,
  add(fn, el) { const it = { fn, el }; this.items.add(it); this.start(); return () => this.items.delete(it); },
  start() {
    if (this.raf) return;
    this.last = performance.now();
    const tick = now => {
      const dt = Math.min(0.05, Math.max(0, (now - this.last) / 1000)); this.last = now;
      for (const it of [...this.items]) {
        if (it.el && !it.el.isConnected) { this.items.delete(it); continue; }
        try { it.fn(dt, now); } catch (e) { console.error(e); this.items.delete(it); }
      }
      this.raf = this.items.size ? requestAnimationFrame(tick) : 0;
    };
    this.raf = requestAnimationFrame(tick);
  },
  clear() { this.items.clear(); }
};
const Keys = new Set();
function onKey(fn, el) { const it = { fn, el }; Keys.add(it); return () => Keys.delete(it); }
const Cleanups = [];
const onCleanup = fn => Cleanups.push(fn);
function cleanupScreen() {
  Loop.clear(); Keys.clear();
  while (Cleanups.length) { try { Cleanups.pop()(); } catch (e) { } }
}

/* ===== 5. RYSOWANIE ===== */
const G = 9.81; // przyspieszenie ziemskie [m/s²]
let COL = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const map = { bg: 'bg', surface: 'surface', surface2: 'surface2', ink: 'ink', muted: 'muted', line: 'line', primary: 'primary', primarySoft: 'primary-soft', accent: 'accent', rose: 'rose', lilac: 'lilac', ok: 'ok', hint: 'hint', font: 'font' };
  for (const k in map) COL[k] = cs.getPropertyValue('--' + map[k]).trim() || '#888';
}
// Dopasowanie rozdzielczości canvasa do ekranu (ostre linie na telefonie)
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(1, Math.round(r.width * dpr)), H = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, r.width, r.height);
  return { ctx, w: r.width, h: r.height };
}
function rr(ctx, x, y, w, hh, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(ctx, s, x, y, o = {}) {
  ctx.fillStyle = o.color || COL.ink; ctx.font = `${o.weight || 700} ${o.size || 14}px ${COL.font}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle'; ctx.fillText(s, x, y);
}
function dash(ctx, x1, y1, x2, y2, color, w = 2) { ctx.save(); ctx.setLineDash([5, 6]); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function arrow(ctx, x1, y1, x2, y2, color, both = false, w = 3) {
  const a = Math.atan2(y2 - y1, x2 - x1), s = 9;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  const head = (x, y, an) => { ctx.moveTo(x, y); ctx.lineTo(x - s * Math.cos(an - 0.45), y - s * Math.sin(an - 0.45)); ctx.moveTo(x, y); ctx.lineTo(x - s * Math.cos(an + 0.45), y - s * Math.sin(an + 0.45)); };
  if (Math.hypot(x2 - x1, y2 - y1) > 6) { head(x2, y2, a); if (both) head(x1, y1, a + Math.PI); }
  ctx.stroke(); ctx.restore();
}
function drawCeiling(ctx, cx, y, w) {
  ctx.fillStyle = COL.line; ctx.fillRect(cx - w / 2, y - 8, w, 8);
  ctx.strokeStyle = COL.muted; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let x = cx - w / 2 + 4; x < cx + w / 2; x += 10) { ctx.moveTo(x, y - 8); ctx.lineTo(x + 7, y - 15); }
  ctx.stroke();
}
// Skórki kulki wahadła (kolekcja nagród)
const SKINS = [
  { id: 'klasyk', name: 'Klasyczna kula', cost: 0 },
  { id: 'ksiezyc', name: 'Księżyc', cost: 60 },
  { id: 'planeta', name: 'Planeta z pierścieniem', cost: 150 },
  { id: 'krysztal', name: 'Kryształ', cost: 250 },
  { id: 'kwiat', name: 'Kwiat', cost: 380 },
  { id: 'kropla', name: 'Kropla', cost: 520 },
  { id: 'gwiazda', name: 'Gwiazda', cost: 680 },
  { id: 'zlota', name: 'Złota kula', cost: 850 }
];
function drawBob(ctx, x, y, r, skin) {
  skin = skin || S.skin;
  ctx.save(); ctx.translate(x, y);
  const circle = (cx, cy, rad, fill) => { ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); };
  switch (skin) {
    case 'ksiezyc': circle(0, 0, r, '#E6E0C8'); circle(-r * .3, -r * .25, r * .22, '#CBC3A6'); circle(r * .35, r * .2, r * .16, '#CBC3A6'); circle(-r * .1, r * .45, r * .1, '#CBC3A6'); break;
    case 'planeta':
      circle(0, 0, r, '#C99F7B'); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-r, -r * .2, r * 2, r * .18);
      ctx.strokeStyle = '#8A79BF'; ctx.lineWidth = Math.max(2, r * .16); ctx.beginPath(); ctx.ellipse(0, 0, r * 1.55, r * .45, -0.35, 0, Math.PI * 2); ctx.stroke(); break;
    case 'krysztal':
      ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; ctx.lineTo(r * 1.1 * Math.cos(a), r * 1.1 * Math.sin(a)); } ctx.closePath();
      ctx.fillStyle = '#86C3D6'; ctx.fill(); ctx.strokeStyle = '#4E93A8'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -r * 1.1); ctx.lineTo(0, r * 1.1); ctx.moveTo(-r * .95, -r * .55); ctx.lineTo(r * .95, r * .55); ctx.stroke(); break;
    case 'kwiat':
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; circle(Math.cos(a) * r * .58, Math.sin(a) * r * .58, r * .5, '#E39FAE'); }
      circle(0, 0, r * .45, '#F0C46A'); break;
    case 'kropla':
      ctx.beginPath(); ctx.moveTo(0, -r * 1.35); ctx.bezierCurveTo(r * .9, -r * .3, r, r * .2, r, r * .3); ctx.arc(0, r * .3, r, 0, Math.PI); ctx.bezierCurveTo(-r, r * .2, -r * .9, -r * .3, 0, -r * 1.35);
      ctx.fillStyle = '#79AEDD'; ctx.fill(); break;
    case 'gwiazda':
      ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .5 : r * 1.2; ctx.lineTo(rad * Math.cos(a), rad * Math.sin(a)); } ctx.closePath();
      ctx.fillStyle = '#EDBE55'; ctx.fill(); ctx.strokeStyle = '#B88A22'; ctx.lineWidth = 1.5; ctx.stroke(); break;
    case 'zlota': { const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r); g.addColorStop(0, '#FFF0B8'); g.addColorStop(1, '#C3922B'); circle(0, 0, r, g); break; }
    default: { const g = ctx.createRadialGradient(-r * .35, -r * .35, r * .1, 0, 0, r); g.addColorStop(0, '#F6D3B4'); g.addColorStop(1, COL.accent); circle(0, 0, r, g); }
  }
  ctx.restore();
}
function drawPendulum(ctx, px, py, len, th, r, skin) {
  const x = px + len * Math.sin(th), y = py + len * Math.cos(th);
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
  ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  drawBob(ctx, x, y, r, skin);
  return { x, y };
}
// Huśtawka widziana z boku: rama, lina i siedzisko
function drawSwing(ctx, px, py, len, th, groundY) {
  ctx.strokeStyle = COL.line; ctx.lineWidth = 7; ctx.lineCap = 'round';
  const half = len * 0.62;
  ctx.beginPath(); ctx.moveTo(px - half, py); ctx.lineTo(px + half, py);
  ctx.moveTo(px - half, py); ctx.lineTo(px - half - len * .2, groundY); ctx.moveTo(px + half, py); ctx.lineTo(px + half + len * .2, groundY); ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px - half - len * .3, groundY); ctx.lineTo(px + half + len * .3, groundY); ctx.stroke();
  const sx = px + len * Math.sin(th), sy = py + len * Math.cos(th);
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke();
  ctx.save(); ctx.translate(sx, sy); ctx.rotate(-th);
  ctx.fillStyle = COL.primary; rr(ctx, -26, -2, 52, 10, 5); ctx.fill();
  ctx.fillStyle = COL.accent; rr(ctx, -16, -9, 32, 8, 4); ctx.fill();
  ctx.restore();
  ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  return { x: sx, y: sy };
}
function drawSpring(ctx, x, y0, y1, coils = 11, w = 16) {
  const lead = 8, L = y1 - y0 - 2 * lead;
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + lead);
  for (let i = 1; i <= coils * 2; i++) ctx.lineTo(x + (i % 2 ? w : -w), y0 + lead + L * (i - 0.5) / (coils * 2));
  ctx.lineTo(x, y1 - lead); ctx.lineTo(x, y1); ctx.stroke();
}

/* ----- Ikony (proste linie, bez zewnętrznych plików) ----- */
const ICONS = {
  map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  sound: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  mute: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/>',
  swing: '<path d="M3 3h18M8 3v12M16 3v12M6 15h12v2.5H6z"/>',
  clock: '<circle cx="12" cy="8" r="5.5"/><path d="M12 8V5.5M12 8l2 1.2M12 13.5v5"/><circle cx="12" cy="20.5" r="1.6"/>',

// Waga poziomu zadania zależnie od wybranej trudności (1 łatwy, 2 średni, 3 wyzwanie)
const LEVEL_W = { 1: { 1: 3, 2: 1.2, 3: 0.15 }, 2: { 1: 1, 2: 3, 3: 1 }, 3: { 1: 0.3, 2: 1.2, 3: 3 } };
function weightedPick(pool, n, diff, avoid = new Set()) {
  const out = []; const cand = pool.filter(q => !avoid.has(q.id));
  while (out.length < n && cand.length) {
    const lastType = out.length ? out[out.length - 1].type : null;
    const ws = cand.map(q => (LEVEL_W[diff][q.level] || 1) * (q.type === lastType ? 0.35 : 1));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
    while (i < ws.length - 1 && (r -= ws[i]) > 0) i++;
    out.push(cand[i]); cand.splice(i, 1);
  }
  return out;
}
// Zamienia wpis z banku na konkretne zadanie (generator losuje nowe liczby)
function mat(q, diff, extra) {
  const base = q.gen ? Object.assign(q.gen(diff), { id: q.id, concept: q.concept, mission: q.mission, level: q.level, title: q.title }) : Object.assign({}, q);
  return Object.assign(base, extra || {});
}
// Pomyłka wraca „w innej formie”: inne zadanie o tym samym pojęciu (najlepiej innego typu) albo nowe liczby
function altFor(mod, m, diff) {
  const q0 = mod.qIndex[m.id];
  if (!q0) return null;
  if (q0.gen) return mat(q0, diff, { forMistake: m.id });
  const same = mod.questions.filter(q => q.concept === m.concept && q.id !== m.id && !S.mistakes[q.id]);
  const other = same.filter(q => q.type !== q0.type);
  const pick = other.length ? rnd(other) : same.length ? rnd(same) : q0;
  return mat(pick, diff, { forMistake: m.id });
}

QT.mc = {
  render(q, body, api) {
    const isTF = q.type === 'tf';
    const list = (isTF ? ['Prawda', 'Fałsz'] : q.opts).map((t, i) => ({ t, i }));
    const opts = isTF || q.keep ? list : shuffle(list);
    const ans = isTF ? (q.answer ? 0 : 1) : 0; // w danych poprawna odpowiedź jest zawsze pierwsza
    let sel = null;
    const box = h('div', { class: 'opts' + (isTF ? ' tfrow' : ''), role: 'radiogroup', 'aria-label': 'Odpowiedzi' });
    const btns = opts.map((o, k) => { const b = h('button', { class: 'opt', type: 'button', role: 'radio', 'aria-checked': 'false', onclick: () => choose(o.i) }, h('span', { class: 'optkey', 'aria-hidden': 'true' }, String(k + 1)), h('span', {}, o.t)); b.dataset.i = o.i; return b; });
    box.append(...btns); body.append(box);
    const byI = i => btns.find(x => +x.dataset.i === i);
    function choose(i) {
      const b = byI(i); if (!b || b.disabled) return;
      sel = i; btns.forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', String(on)); });
      api.ready(true); Sound.play('tap');
    }
    return {
      check: () => ({ ok: sel === ans }),
      retry() { const b = byI(sel); if (b) { b.classList.remove('sel'); b.classList.add('tried'); b.disabled = true; b.setAttribute('aria-checked', 'false'); } sel = null; api.ready(false); },
      reveal() { btns.forEach(x => { x.disabled = true; if (+x.dataset.i === ans) x.classList.add('right'); }); },
      key(n) { const b = btns[n - 1]; if (b) choose(+b.dataset.i); }
    };
  }
};
QT.tf = QT.mc;

/* --- dopasowywanie par --- */
QT.match = {
  render(q, body, api) {
    const n = q.pairs.length, pair = {}; let sel = null, locked = false;
    const colors = ['--primary', '--accent', '--lilac', '--rose', '--ok'];
    const lb = q.pairs.map((p, i) => h('button', { class: 'mitem', type: 'button', onclick: () => tap('L', i) }, p[0]));
    const rb = shuffle(q.pairs.map((p, i) => i)).map(i => { const b = h('button', { class: 'mitem', type: 'button', onclick: () => tap('R', i) }, q.pairs[i][1]); b.dataset.i = i; return b; });
    const rbtn = i => rb.find(b => +b.dataset.i === i);
    body.append(h('p', { class: 'note' }, 'Kliknij pojęcie po lewej, a potem pasujący opis po prawej. Kliknij parę jeszcze raz, by ją rozłączyć.'),
      h('div', { class: 'match' }, h('div', { class: 'mcol' }, lb), h('div', { class: 'mcol' }, rb)));
    const leftOf = ri => { for (const k in pair) if (pair[k] === ri) return +k; return -1; };
    function paint() {
      [...lb, ...rb].forEach(b => { b.removeAttribute('data-n'); b.style.removeProperty('--pc'); b.classList.remove('sel'); });
      if (sel) (sel.s === 'L' ? lb[sel.i] : rbtn(sel.i)).classList.add('sel');
      let k = 0;
      for (const li in pair) { k++; const c = `var(${colors[(k - 1) % colors.length]})`; [lb[li], rbtn(pair[li])].forEach(b => { b.dataset.n = k; b.style.setProperty('--pc', c); }); }
      api.ready(Object.keys(pair).length === n);
    }
    function tap(side, i) {
      if (locked) return; Sound.play('tap');
      const li0 = side === 'L' ? (pair[i] !== undefined ? i : -1) : leftOf(i);
      if (li0 >= 0 && !(sel && sel.s !== side)) { delete pair[li0]; sel = null; paint(); return; }
      if (!sel || sel.s === side) { sel = (sel && sel.s === side && sel.i === i) ? null : { s: side, i }; paint(); return; }
      const li = side === 'L' ? i : sel.i, ri = side === 'R' ? i : sel.i;
      delete pair[li]; const old = leftOf(ri); if (old >= 0) delete pair[old];
      pair[li] = ri; sel = null; paint();
    }
    return {
      check: () => ({ ok: q.pairs.every((p, i) => pair[i] === i) }),
      retry() {
        for (const li in pair) if (pair[li] !== +li) { const a = lb[li], b = rbtn(pair[li]); [a, b].forEach(x => { x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 1500); }); delete pair[li]; }
        paint();
      },
      reveal() { q.pairs.forEach((p, i) => { pair[i] = i; }); sel = null; paint(); locked = true; [...lb, ...rb].forEach(b => b.disabled = true); }
    };
  }
};

/* --- przeciągane klocki: luki w tekście i kreator wzorów --- */
function dragChip(chip, area, onDrop, onTap) {
  let st = null, ghost = null, suppress = false, over = null;
  chip.addEventListener('pointerdown', e => { if (e.button > 0 || chip.disabled) return; st = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
  chip.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    if (!ghost && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 8) {
      ghost = chip.cloneNode(true); ghost.classList.add('ghost'); document.body.append(ghost); chip.classList.add('dragging');
      try { chip.setPointerCapture(e.pointerId); } catch (_) { }
    }
    if (ghost) {
      ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
      const t = document.elementFromPoint(e.clientX, e.clientY), s = t && t.closest('.slot');
      if (over && over !== s) over.classList.remove('hover');
      over = s && area.contains(s) ? s : null; if (over) over.classList.add('hover');
    }
  });
  const end = e => {
    if (!st) return;
    if (ghost) {
      ghost.remove(); ghost = null; chip.classList.remove('dragging'); if (over) over.classList.remove('hover');
      const t = document.elementFromPoint(e.clientX, e.clientY), s = t && t.closest('.slot');
      if (s && area.contains(s)) onDrop(s);
      suppress = true; setTimeout(() => { suppress = false; }, 80);
    }
    st = null; over = null;
  };
  chip.addEventListener('pointerup', end);
  chip.addEventListener('pointercancel', () => { if (ghost) ghost.remove(); ghost = null; st = null; chip.classList.remove('dragging'); });
  chip.addEventListener('click', () => { if (suppress) { suppress = false; return; } onTap(); });
}
QT.slots = {
  render(q, body, api) {
    const wrap = h('div', { class: 'slots' + (q.formula ? ' formula' : '') });
    const line = h('p', { class: 'slot-line' });
    const acc = i => [].concat(q.answers[i]);
    const slots = []; let locked = false, focusSlot = null;
    q.template.split(/\[\[(\d+)\]\]/).forEach((p, i) => {
      if (i % 2 === 0) { if (p) line.append(p); return; }
      const s = h('button', { class: 'slot', type: 'button', 'aria-label': 'Puste miejsce ' + (+p + 1) });
      s.dataset.idx = p; s.chip = null; slots[+p] = s; line.append(s);
      s.addEventListener('click', () => { if (locked) return; if (s.chip) unplace(s); else { focusSlot = s; slots.forEach(x => x.classList.toggle('hover', x === s)); } });
    });
    const words = shuffle(q.answers.map(a => [].concat(a)[0]).concat(q.extra || []));
    const bank = h('div', { class: 'bank', 'aria-label': 'Klocki do wyboru' });
    const chips = words.map(w => { const c = h('button', { class: 'chip', type: 'button' }, w); dragChip(c, wrap, s => place(c, s), () => tapChip(c)); return c; });
    bank.append(...chips);
    wrap.append(line); body.append(h('p', { class: 'note' }, 'Przeciągnij klocek na puste miejsce albo kliknij klocek, a trafi w pierwsze wolne miejsce.'), wrap, bank);
    function place(chip, s) {
      if (locked) return;
      if (s.chip) unplace(s);
      s.chip = chip; s.textContent = chip.textContent; s.classList.add('filled'); s.classList.remove('bad', 'hover'); chip.hidden = true;
      s.setAttribute('aria-label', 'Miejsce ' + (+s.dataset.idx + 1) + ': ' + chip.textContent + '. Kliknij, aby zabrać klocek.');
      focusSlot = null; Sound.play('tap'); update();
    }
    function unplace(s) { if (!s.chip) return; s.chip.hidden = false; s.chip = null; s.textContent = ''; s.classList.remove('filled'); s.setAttribute('aria-label', 'Puste miejsce ' + (+s.dataset.idx + 1)); update(); }
    function tapChip(c) { const s = (focusSlot && !focusSlot.chip) ? focusSlot : slots.find(x => !x.chip); if (s) place(c, s); }
    const update = () => api.ready(slots.every(s => s.chip));
    const okAt = i => slots[i].chip && acc(i).includes(slots[i].chip.textContent);
    return {
      check: () => ({ ok: slots.every((s, i) => okAt(i)) }),
      retry() { slots.forEach((s, i) => { if (!okAt(i)) { unplace(s); s.classList.add('bad'); } }); },
      reveal() { locked = true; slots.forEach((s, i) => { s.textContent = acc(i)[0]; s.classList.add('revealed'); s.disabled = true; }); chips.forEach(c => { c.disabled = true; }); bank.hidden = true; }
    };
  }
};

QT.click = {

    return {
      check: () => ({ ok: q.correct.includes(sel) }),
      retry() { const g = hots.find(x => x.dataset.hot === sel); if (g) { g.classList.remove('sel'); g.classList.add('tried'); } sel = null; api.ready(false); },
      reveal() { locked = true; hots.forEach(x => { x.classList.remove('sel'); if (q.correct.includes(x.dataset.hot)) x.classList.add('right'); }); }
    };
  }
};

/* --- ustaw suwak tak, aby... (z żywą symulacją) --- */
let uid = 0;
QT.slider = {
  render(q, body, api) {
    const cv = h('canvas', { class: 'sim', role: 'img', 'aria-label': q.label });
    const sim = SIMS[q.sim](cv, q);
    const id = 'sl' + (++uid);
    const out = h('output', { class: 'readout', for: id });
    const inp = h('input', { type: 'range', id, min: q.min, max: q.max, step: q.step, value: q.init });
    const upd = () => { const v = +inp.value; sim.set(v); out.textContent = sim.readout(v); };
    inp.addEventListener('input', () => { upd(); api.ready(true); });
    upd();
    body.append(cv, h('label', { class: 'lbl', for: id }, q.label), inp, out);
    return {
      check: () => { const v = +inp.value; return { ok: q.check(v), msg: q.hintFn ? q.hintFn(v) : null }; },
      retry() { api.ready(false); },
      reveal() { inp.value = q.target; upd(); inp.disabled = true; }
    };
  }
};

/* --- zadanie rachunkowe: dane, szukane, wzór, wynik, jednostka --- */
const UNITS = ['s', 'Hz', 'm', 'bez jednostki'];
QT.calc = {
  render(q, body, api) {
    const id = 'calc' + (++uid);
    let fi = null, unit = null, locked = false;
    const dl = h('dl', { class: 'calc-data' });
    q.data.forEach(d => dl.append(h('dt', {}, d[0]), h('dd', {}, d[1])));
    dl.append(h('dt', {}, 'Szukane'), h('dd', {}, q.find + ' = ?'));
    const fOrder = shuffle(q.formulas.map((f, i) => i));
    const fBtns = fOrder.map(i => { const b = h('button', { class: 'choice', type: 'button', role: 'radio', 'aria-checked': 'false', onclick: () => { if (locked) return; fi = i; paint(); } }, q.formulas[i]); b.dataset.i = i; return b; });
    const inp = h('input', { class: 'numin', id, type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'np. 0,5' });
    inp.addEventListener('input', () => { inp.classList.remove('okv'); paint(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); api.submit(); } });
    const uBtns = UNITS.map(u => { const b = h('button', { class: 'choice', type: 'button', role: 'radio', 'aria-checked': 'false', onclick: () => { if (locked) return; unit = u; paint(); } }, u); b.dataset.u = u; return b; });
    function paint() {
      fBtns.forEach(b => b.setAttribute('aria-checked', String(+b.dataset.i === fi)));
      uBtns.forEach(b => b.setAttribute('aria-checked', String(b.dataset.u === unit)));
      api.ready(fi !== null && inp.value.trim() !== '' && unit !== null);
    }
    body.append(dl,
      h('div', { class: 'stack' }, h('p', { class: 'lbl' }, '1. Wybierz wzór'), h('div', { class: 'row wrap', role: 'radiogroup', 'aria-label': 'Wzór' }, fBtns)),
      h('div', { class: 'stack' }, h('label', { class: 'lbl', for: id }, '2. Wpisz wynik ' + q.find + ' ='), inp),
      h('div', { class: 'stack' }, h('p', { class: 'lbl' }, '3. Wybierz jednostkę'), h('div', { class: 'row wrap', role: 'radiogroup', 'aria-label': 'Jednostka' }, uBtns)));
    const tol = Math.abs(q.answer) * 0.02 + 1e-9;
    let last = {};
    return {
      check() {
        const v = parseNum(inp.value);
        last = { f: fi === q.fIdx, n: Math.abs(v - q.answer) <= tol, u: unit === q.unit };
        const ok = last.f && last.n && last.u;
        let msg = null;
        if (!last.f) msg = 'Sprawdź wzór. ' + q.hint;
        else if (!last.n) msg = 'Wzór jest dobry! Sprawdź obliczenia. ' + (q.hintCalc || '');
        else if (!last.u) msg = 'Liczba jest dobra! Zastanów się nad jednostką: czego szukasz?';
        return { ok, msg };
      },
      retry() { if (!last.f) fi = null; if (!last.n) inp.value = ''; else inp.classList.add('okv'); if (!last.u) unit = null; paint(); },
      reveal() {
        locked = true; fi = q.fIdx; unit = q.unit; inp.value = fmt(q.answer, 4); inp.disabled = true; paint();
        fBtns.forEach(b => { b.disabled = true; if (+b.dataset.i === q.fIdx) b.classList.add('right'); });
        uBtns.forEach(b => { b.disabled = true; if (b.dataset.u === q.unit) b.classList.add('right'); });
      }
    };
  }
};

/* --- przebieg jednego zadania: sprawdź → wskazówka → druga szansa → wyjaśnienie --- */
function levelDots(l) { const d = h('span', { class: 'dots', 'aria-label': `Poziom ${l} z 3` }); for (let i = 1; i <= 3; i++) d.append(h('i', { class: i <= l ? 'on' : '' })); return d; }
function runQuestion(host, q, o) {
  const maxTries = q.type === 'tf' ? 1 : 2;
  let tries = 0, help = 0, done = false;
  const card = h('article', { class: 'card qcard' });
  const title = h('h2', { class: 'qtext', tabindex: '-1' }, q.q);
  const body = h('div', { class: 'qbody' });
  const helpBox = h('div', { class: 'helpbox', hidden: true, 'aria-live': 'polite' });
  const fb = h('div', { class: 'feedback', 'aria-live': 'polite' });
  const helpLabel = document.createTextNode('Pomocy!');
  const bHelp = h('button', { class: 'btn ghost', type: 'button', onclick: doHelp }, icon('help'), helpLabel);
  const bCheck = h('button', { class: 'btn primary', type: 'button', disabled: true, onclick: doCheck }, 'Sprawdź');
  const actions = h('div', { class: 'qactions' }, bHelp, bCheck);
  card.append(h('div', { class: 'qmeta' }, h('span', { class: 'tag' }, TYPE_LABEL[q.type] || ''), o.label ? h('span', {}, o.label) : null, levelDots(q.level || 1)), title, body, helpBox, fb, actions);
  host.append(card);
  const R = QT[q.type].render(q, body, { ready: v => { if (!done) bCheck.disabled = !v; }, submit: () => doCheck() });
  try { title.focus({ preventScroll: true }); } catch (e) { }
  const offKey = onKey(e => { if (done || isTyping(e)) return; if (/^[1-9]$/.test(e.key) && R.key) R.key(+e.key); }, card);

  function doHelp() {
    help++; helpBox.hidden = false; helpBox.innerHTML = '';
    helpBox.append(h('p', { class: 'hb-t' }, 'Podpowiedź'), h('p', {}, q.hint || 'Przeczytaj pytanie jeszcze raz, powoli.'));
    if (help >= 2) {
      helpBox.append(h('p', { class: 'hb-t' }, 'Krok po kroku'), h('ol', {}, (q.steps || [q.expl]).map(s => h('li', {}, s))));
      bHelp.disabled = true;
    } else helpLabel.textContent = 'Więcej pomocy';
  }
  function doCheck() {
    if (done || bCheck.disabled) return;
    tries++;
    const res = R.check();
    if (res.ok) return finish(true);
    if (tries < maxTries) {
      fb.className = 'feedback fb-hint'; fb.innerHTML = '';
      fb.append(h('p', { class: 'fb-t' }, rnd(TRY_AGAIN)), h('p', {}, res.msg || q.hint || 'Przyjrzyj się jeszcze raz.'), h('p', { class: 'small muted' }, 'Masz drugą szansę – bez utraty punktów za pomoc.'));
      R.retry(); return;
    }
    finish(false);
  }
  function finish(ok) {
    done = true; offKey(); R.reveal();
    const pts = ok ? (tries === 1 ? 10 : 6) : 2;
    bCheck.remove(); bHelp.disabled = true;
    fb.className = 'feedback ' + (ok ? 'fb-ok' : 'fb-learn'); fb.innerHTML = '';
    if (ok) {
      fb.append(h('p', { class: 'fb-t' }, q.ok || rnd(tries === 1 ? OK_FIRST : OK_SECOND)), q.expl ? h('p', {}, h('b', {}, 'Dlaczego? '), q.expl) : null, h('p', { class: 'pts' }, `+${pts} pkt`));
      burst(card); Sound.play('ok');
    } else {
      fb.append(h('p', { class: 'fb-t' }, tries > 1 ? 'To było trudne. Zobacz, jak to działa:' : 'Nie tym razem. Zobacz, jak to działa:'), h('p', {}, q.expl),
        q.anim ? miniAnim(q.anim) : null,
        h('p', { class: 'small' }, 'Poprawna odpowiedź jest zaznaczona na zielono. To zadanie wróci później w innej formie.'), h('p', { class: 'pts' }, `+${pts} pkt za wysiłek`));
    }
    const result = { q, ok, firstTry: ok && tries === 1, usedHelp: help > 0, points: pts };
    recordResult(result);
    const bNext = h('button', { class: 'btn primary', type: 'button', onclick: () => o.onNext(result) }, o.nextLabel || 'Dalej');
    actions.append(bNext);
    try { bNext.focus({ preventScroll: true }); } catch (e) { }
    if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest', behavior: S.settings.anim ? 'smooth' : 'auto' });
  }
}

/* ===== RYSUNKI SVG DO ZADAŃ „KLIKNIJ” ===== */
const SV = {
  arrowPath(x1, y1, x2, y2, col, w = 4) {
    const a = Math.atan2(y2 - y1, x2 - x1), s = 9;
    const hd = (x, y, an) => `M${x} ${y}L${(x - s * Math.cos(an - .45)).toFixed(1)} ${(y - s * Math.sin(an - .45)).toFixed(1)}M${x} ${y}L${(x - s * Math.cos(an + .45)).toFixed(1)} ${(y - s * Math.sin(an + .45)).toFixed(1)}`;
    return `<path class="hot-shape" d="M${x1} ${y1}L${x2} ${y2}${hd(x2, y2, a)}${hd(x1, y1, a + Math.PI)}" style="fill:none;stroke:${col};stroke-width:${w};stroke-linecap:round"/>`;
  },
  hit: (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:transparent;stroke-width:28"/>`,
  badge: (x, y, t) => `<circle cx="${x}" cy="${y}" r="13" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/><text x="${x}" y="${y + 5}" text-anchor="middle" class="svg-lbl">${t}</text>`,
  dashed: (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5"/>`,
  // Wahadło w trzech położeniach A, O, B
  positions() {
    const px = 160, py = 26, L = 150, yE = py + L * Math.sqrt(.75);
    let s = `<svg viewBox="0 0 320 240" class="qsvg" role="group" aria-label="Wahadło narysowane w trzech położeniach A, O i B"><rect x="115" y="14" width="90" height="10" rx="3" style="fill:var(--line)"/>`;
    s += `<path d="M${px - 75} ${yE.toFixed(1)}A${L} ${L} 0 0 0 ${px + 75} ${yE.toFixed(1)}" style="fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 6"/>`;
    [['A', -.5], ['O', 0], ['B', .5]].forEach(([id, sn]) => {
      const x = px + L * sn, y = (py + L * Math.sqrt(1 - sn * sn)).toFixed(1);
      s += `<g data-hot="${id}" data-label="Punkt ${id}"><line x1="${px}" y1="${py}" x2="${x}" y2="${y}" style="stroke:var(--muted);stroke-width:2${id === 'O' ? '' : ';stroke-dasharray:5 5'}"/><circle class="hot-shape" cx="${x}" cy="${y}" r="20" style="fill:var(--accent);stroke:var(--surface);stroke-width:3"/><text x="${x}" y="${+y + 44}" text-anchor="middle" class="svg-lbl">${id}</text></g>`;
    });
    return s + '</svg>';
  },
  // Trzy strzałki: amplituda, dwie amplitudy, długość nici
  swingArrows() {
    const px = 160, py = 22, L = 120, xl = 100, xr = 220, ye = 126, yo = 142;
    let s = `<svg viewBox="0 0 320 250" class="qsvg" role="group" aria-label="Wahadło i trzy ponumerowane strzałki"><rect x="120" y="10" width="80" height="10" rx="3" style="fill:var(--line)"/>`;
    s += `<line x1="${px}" y1="${py}" x2="${xl}" y2="${ye}" style="stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5"/><line x1="${px}" y1="${py}" x2="${xr}" y2="${ye}" style="stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5"/><line x1="${px}" y1="${py}" x2="${px}" y2="${yo}" style="stroke:var(--ink);stroke-width:2"/>`;
    s += `<circle cx="${xl}" cy="${ye}" r="13" style="fill:var(--accent);opacity:.45"/><circle cx="${xr}" cy="${ye}" r="13" style="fill:var(--accent);opacity:.45"/><circle cx="${px}" cy="${yo}" r="14" style="fill:var(--accent)"/>`;
    s += SV.dashed(px, yo + 14, px, 236) + SV.dashed(xl, ye + 13, xl, 236) + SV.dashed(xr, ye + 13, xr, 236);
    s += `<g data-hot="a1" data-label="Strzałka 1">${SV.hit(px, 182, xr, 182)}${SV.arrowPath(px + 3, 182, xr - 3, 182, 'var(--primary)')}${SV.badge(190, 164, 1)}</g>`;
    s += `<g data-hot="a2" data-label="Strzałka 2">${SV.hit(xl, 224, xr, 224)}${SV.arrowPath(xl + 3, 224, xr - 3, 224, 'var(--lilac)')}${SV.badge(130, 206, 2)}</g>`;
    s += `<g data-hot="a3" data-label="Strzałka 3">${SV.hit(132, py + 6, 132, yo - 6)}${SV.arrowPath(132, py + 6, 132, yo - 6, 'var(--rose)')}${SV.badge(112, 80, 3)}</g>`;
    return s + '</svg>';
  },
  wave(x0, y0, A, Tp, len, mode) {
    let d = '';
    for (let i = 0; i <= len; i += 2) {
      let a = A; if (mode === 'decay') a = A * Math.exp(-i * 0.011); if (mode === 'grow') a = A * Math.min(1, 0.2 + i * 0.0035);
      d += (i ? 'L' : 'M') + (x0 + i) + ' ' + (y0 - a * Math.cos(2 * Math.PI * i / Tp)).toFixed(1);

    return `<path d="${d}" style="fill:none;stroke:var(--primary);stroke-width:3;stroke-linejoin:round"/>`;

  graphAmp() {

    s += SV.dashed(240, 65, 284, 65) + SV.dashed(190, 185, 284, 185);
    s += `<g data-hot="a1" data-label="Strzałka 1">${SV.hit(140, 122, 140, 68)}${SV.arrowPath(140, 122, 140, 68, 'var(--accent)')}${SV.badge(160, 100, 1)}</g>`;
    s += `<g data-hot="a2" data-label="Strzałka 2">${SV.hit(278, 182, 278, 68)}${SV.arrowPath(278, 182, 278, 68, 'var(--lilac)')}${SV.badge(300, 150, 2)}</g>`;
    s += `<g data-hot="a3" data-label="Strzałka 3">${SV.hit(143, 46, 237, 46)}${SV.arrowPath(143, 46, 237, 46, 'var(--rose)')}${SV.badge(190, 30, 3)}</g>`;
    return s + '</svg>';
  },
  // Wykres x(t) z trzema przedziałami czasu: T/2, T, 2T
  graphPeriod() {
    const br = (x1, x2, y, up, col) => `<path class="hot-shape" d="M${x1} ${y + (up ? 9 : -9)}V${y}H${x2}V${y + (up ? 9 : -9)}" style="fill:none;stroke:${col};stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>`;
    let s = `<svg viewBox="0 0 320 236" class="qsvg" role="group" aria-label="Wykres wychylenia od czasu z trzema zaznaczonymi przedziałami">` + SV.axes(40, 125, 262, 28, 200) + SV.wave(40, 125, 55, 100, 260);
    s += SV.dashed(140, 70, 140, 30) + SV.dashed(240, 70, 240, 30) + SV.dashed(90, 180, 90, 52);
    s += `<g data-hot="s1" data-label="Przedział 1">${SV.hit(40, 52, 90, 52)}${br(40, 90, 52, true, 'var(--lilac)')}${SV.badge(65, 36, 1)}</g>`;
    s += `<g data-hot="s2" data-label="Przedział 2">${SV.hit(140, 30, 240, 30)}${br(140, 240, 30, true, 'var(--accent)')}${SV.badge(190, 16, 2)}</g>`;
    s += `<g data-hot="s3" data-label="Przedział 3">${SV.hit(40, 214, 240, 214)}${br(40, 240, 214, false, 'var(--rose)')}${SV.badge(140, 224, 3)}</g>`;
    return s + '</svg>';
  },
  // Trzy małe wykresy: drgania stałe, tłumione, narastające
  graphsDamped() {
    let s = `<svg viewBox="0 0 320 270" class="qsvg" role="group" aria-label="Trzy wykresy drgań oznaczone A, B i C">`;
    [['A', 'flat'], ['B', 'decay'], ['C', 'grow']].forEach(([id, mode], k) => {
      const y = 8 + k * 88;
      s += `<g data-hot="${id}" data-label="Wykres ${id}"><rect class="hot-shape" x="6" y="${y}" width="308" height="78" rx="12" style="fill:var(--surface);stroke:var(--line);stroke-width:2"/>` +
        `<text x="26" y="${y + 45}" text-anchor="middle" class="svg-lbl">${id}</text>` + `<line x1="48" y1="${y + 39}" x2="304" y2="${y + 39}" style="stroke:var(--line);stroke-width:1"/>` + SV.wave(50, y + 39, 30, 42, 250, mode) + `</g>`;

/* ===== SYMULACJE (oparte na wzorach fizycznych, nie „na oko”) =====
   Wahadło matematyczne: T = 2π·√(l/g)  (dla małych wychyleń)
   Ciężarek na sprężynie: T = 2π·√(m/k)
   Wzory służą do animacji; uczeń poznaje zależności jakościowo, zgodnie z podstawą programową. */
const periodPendulum = L => 2 * Math.PI * Math.sqrt(L / G);
const periodSpring = (m, k) => 2 * Math.PI * Math.sqrt(m / k);
const animOn = () => S.settings.anim;

// Symulacje dla zadań typu „ustaw suwak”
const SIMS = {
  pendulumL(cv, q) {
    let L = q.init, ph = 0;
    Loop.add(dt => {
      ph += dt * 2 * Math.PI / periodPendulum(L) * (animOn() ? 1 : 0);
      const { ctx, w, h: H } = fit(cv), px = w / 2, py = 24;
      drawCeiling(ctx, px, py, 130);
      drawPendulum(ctx, px, py, 20 + (H - 62) * (L / q.max), 0.26 * Math.cos(ph), 13);
    }, cv);
    return { set(v) { L = v; }, readout: v => `Długość: ${fmt(v, 2)} m  ·  Okres: ${fmt(periodPendulum(v), 2)} s` };
  },
  springM(cv, q) {
    const k = q.k; let m = q.init, ph = 0;
    Loop.add(dt => {
      ph += dt * 2 * Math.PI / periodSpring(m, k) * (animOn() ? 1 : 0);
      const { ctx, w, h: H } = fit(cv); drawSpringScene(ctx, w, H, m, k, Math.cos(ph));
    }, cv);
    return { set(v) { m = v; }, readout: v => `Masa: ${fmt(v, 2)} kg  ·  Okres: ${fmt(periodSpring(v, k), 2)} s` };
  },
  // Huśtawka pchana w zadanym rytmie: amplituda drgań wymuszonych (stan ustalony)
  driven(cv, q) {
    let f = q.init, A = 0.05, t = 0;
    const w0 = 2 * Math.PI * 0.5, beta = 0.12, F = 0.452;
    Loop.add(dt => {
      if (animOn()) t += dt;
      const w = 2 * Math.PI * f;
      const target = Math.min(0.75, F / Math.sqrt((w0 * w0 - w * w) ** 2 + (2 * beta * w) ** 2));
      A += (target - A) * Math.min(1, dt * 0.9);
      const { ctx, w: W, h: H } = fit(cv), px = W / 2, py = 26, len = H - 96;
      const th = A * Math.cos(w * t);
      const seat = drawSwing(ctx, px, py, len, th, H - 40);
      if (Math.cos(w * t) < -0.93) arrow(ctx, seat.x - 50, seat.y, seat.x - 30, seat.y, COL.accent, false, 4);
      // miernik wychylenia
      const bw = Math.min(260, W - 40), bx = (W - bw) / 2, by = H - 22;
      ctx.fillStyle = COL.surface; rr(ctx, bx, by, bw, 10, 5); ctx.fill(); ctx.strokeStyle = COL.line; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = COL.accent; rr(ctx, bx, by, Math.max(10, bw * A / 0.75), 10, 5); ctx.fill();
      txt(ctx, 'wychylenie huśtawki', W / 2, by - 10, { size: 12, color: COL.muted, weight: 400 });
    }, cv);
    return { set(v) { f = v; }, readout: v => `Rytm pchania: ${fmt(v, 2)} Hz (pchnięcie co ${fmt(1 / v, 2)} s)` };
  }
};
// Scena: sprężyna z ciężarkiem; pos = cos(faza) w zakresie −1..1
function drawSpringScene(ctx, w, H, m, k, pos, opts = {}) {
  const px = w / 2, top = 22;
  drawCeiling(ctx, px, top, 120);
  const rest = H * 0.17, stretch = Math.min(1, m * G / k) * H * 0.3, A = H * 0.07;
  const yEq = top + rest + stretch, y = yEq + A * pos;
  const bs = H * 0.07 + H * 0.06 * m;
  drawSpring(ctx, px, top, y, 11, 15);
  ctx.fillStyle = COL.primary; rr(ctx, px - bs * 0.7, y, bs * 1.4, bs, 6); ctx.fill();
  txt(ctx, fmt(m, 2) + ' kg', px, y + bs / 2, { size: 12, color: COL.surface });
  if (opts.eq !== false) { dash(ctx, px - 90, yEq + bs / 2, px + 90, yEq + bs / 2, COL.muted, 1.5); txt(ctx, 'położenie równowagi', px + 92, yEq + bs / 2, { size: 12, align: 'left', color: COL.muted, weight: 400 }); }
}

/* ----- Małe animacje do wstępów i wyjaśnień ----- */
const MINI = {
  swing(ctx, w, H, t, labels) {
    const px = w / 2, py = 24, len = H - 84, T = periodPendulum(2.2), th0 = 0.42, th = th0 * Math.cos(2 * Math.PI * t / T);
    const seat = drawSwing(ctx, px, py, len, th, H - 22);
    if (labels) {
      const ax = py + len + 28, xr = px + len * Math.sin(th0);
      dash(ctx, px, py, px, ax + 6, COL.muted); dash(ctx, xr, py + len * Math.cos(th0), xr, ax + 6, COL.lilac);
      arrow(ctx, px, ax, xr, ax, COL.lilac, true); txt(ctx, 'A', (px + xr) / 2, ax - 10, { color: COL.lilac });
      txt(ctx, 'O', px - 12, ax, {});
      arrow(ctx, px, seat.y + 18, seat.x, seat.y + 18, COL.accent, false, 2);
    }
  },
  swinglabels(ctx, w, H, t) { MINI.swing(ctx, w, H, t, true); },
  clock(ctx, w, H, t) {
    const T = 1.5, L = G * (T / 2 / Math.PI) ** 2, px = w / 2, py = 26;
    ctx.strokeStyle = COL.line; ctx.lineWidth = 3; rr(ctx, px - 70, 12, 140, H - 24, 16); ctx.stroke();
    drawPendulum(ctx, px, py, H - 80, 0.3 * Math.cos(2 * Math.PI * t / T), 14);
    txt(ctx, `drgania: ${Math.floor(t / T)}`, px + 80, 30, { align: 'left', size: 14 });
    txt(ctx, `t = ${fmt(t % 100, 1)} s`, px + 80, 52, { align: 'left', size: 14, weight: 400 });
    txt(ctx, 'T = 1,5 s', px - 80, 30, { align: 'right', size: 14, color: COL.primary });
  },
  lab(ctx, w, H, t) {
    [[w * 0.3, 0.25, 'krótkie'], [w * 0.7, 1.0, 'długie']].forEach(([px, L, lab]) => {
      const T = periodPendulum(L), len = 20 + (H - 70) * L;
      drawCeiling(ctx, px, 24, 70);
      drawPendulum(ctx, px, 24, len, 0.28 * Math.cos(2 * Math.PI * t / T), 11);
      txt(ctx, `${lab}: T = ${fmt(T, 1)} s`, px, H - 14, { size: 13 });
    });
  },
  spring(ctx, w, H, t) { drawSpringScene(ctx, w, H, 0.5, 15, Math.cos(2 * Math.PI * t / periodSpring(0.5, 15))); },
  energy(ctx, w, H, t) {
    const px = w * 0.38, py = 24, len = H - 70, th0 = 0.6, th = th0 * Math.cos(2 * Math.PI * t / 2.2);
    drawCeiling(ctx, px, py, 100); drawPendulum(ctx, px, py, len, th, 13);
    const ep = (1 - Math.cos(th)) / (1 - Math.cos(th0)), ek = 1 - ep, bx = w * 0.72, bh = H - 70;
    [[bx, ep, COL.lilac, 'Ep'], [bx + 44, ek, COL.accent, 'Ek']].forEach(([x, v, c, l]) => {
      ctx.fillStyle = COL.surface; ctx.fillRect(x, 30, 26, bh); ctx.fillStyle = c; ctx.fillRect(x, 30 + bh * (1 - v), 26, bh * v);
      ctx.strokeStyle = COL.line; ctx.strokeRect(x, 30, 26, bh); txt(ctx, l, x + 13, H - 22, {});
    });
  },
  damped(ctx, w, H, t) {
    const tt = t % 16, px = w / 2, py = 24, ww = Math.sqrt(G / 1), th = 0.5 * Math.exp(-0.22 * tt) * Math.cos(ww * tt);
    drawCeiling(ctx, px, py, 100); drawPendulum(ctx, px, py, H - 62, th, 13);
    txt(ctx, 'opór powietrza zabiera energię', px, H - 14, { size: 13, color: COL.muted, weight: 400 });
  },
  resonance(ctx, w, H, t) {
    const tt = t % 18, T = 2.4, A = 0.06 + 0.42 * Math.min(1, tt / 13), ph = 2 * Math.PI * tt / T;
    const seat = drawSwing(ctx, w / 2, 24, H - 84, A * Math.cos(ph + Math.PI), H - 22);
    if (Math.cos(ph + Math.PI) < -0.95) arrow(ctx, seat.x - 52, seat.y, seat.x - 30, seat.y, COL.accent, false, 4);
    txt(ctx, 'pchnięcia w rytmie huśtawki', w / 2, H - 8, { size: 12, color: COL.muted, weight: 400 });
  },
  graph(ctx, w, H, t) {
    const x0 = 34, y0 = H / 2, A = H * 0.3, Tp = 110;
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0, 14); ctx.lineTo(x0, H - 14); ctx.moveTo(x0, y0); ctx.lineTo(w - 10, y0); ctx.stroke();
    txt(ctx, 'x', x0 - 14, 20, {}); txt(ctx, 't', w - 14, y0 + 16, {});
    const shown = Math.min(w - x0 - 14, (t * 60) % (w * 1.6));
    ctx.strokeStyle = COL.primary; ctx.lineWidth = 3; ctx.beginPath();
    for (let i = 0; i <= shown; i += 2) ctx.lineTo(x0 + i, y0 - A * Math.cos(2 * Math.PI * i / Tp));
    ctx.stroke();
    if (shown > Tp + 4) { arrow(ctx, x0, 22, x0 + Tp, 22, COL.accent, true, 2); txt(ctx, 'T', x0 + Tp / 2, 12, { color: COL.accent }); }
    arrow(ctx, x0 + Tp, y0, x0 + Tp, y0 - A, COL.lilac, true, 2); txt(ctx, 'A', x0 + Tp + 12, y0 - A / 2, { color: COL.lilac });
  }
};
const MINI_LABEL = { swing: 'Animacja: huśtawka', swinglabels: 'Animacja: huśtawka z położeniem równowagi i amplitudą', clock: 'Animacja: wahadło zegara i licznik drgań', lab: 'Animacja: krótkie i długie wahadło', spring: 'Animacja: ciężarek na sprężynie', energy: 'Animacja: energia potencjalna i kinetyczna wahadła', damped: 'Animacja: drgania tłumione', resonance: 'Animacja: rezonans huśtawki', graph: 'Animacja: wykres wychylenia od czasu' };

// Mini-wyzwanie „zatrzymaj we właściwym momencie”
function stopChallenge(o) {
  let k = 0, frozen = false;
  const p = h('p', {}, o.tasks[0].text), fb = h('p', { class: 'small', 'aria-live': 'polite' });
  const btn = h('button', { class: 'btn primary big', type: 'button' }, 'Stop!');
  btn.addEventListener('click', () => {
    if (k >= o.tasks.length) return;
    if (frozen) { frozen = false; o.freeze(false); btn.textContent = 'Stop!'; fb.textContent = ''; return; }
    frozen = true; o.freeze(true);
    const r = o.ratio(), task = o.tasks[k];
    if (task.test(r)) {
      fb.textContent = task.ok; Sound.play('good'); k++;
      if (k >= o.tasks.length) { btn.textContent = 'Zaliczone'; btn.disabled = true; setTimeout(() => { o.freeze(false); }, 1400); o.onDone(); }
      else { btn.textContent = 'Puść dalej'; setTimeout(() => { p.textContent = o.tasks[k].text; }, 900); }
    } else { fb.textContent = task.miss(r); btn.textContent = 'Puść dalej'; }
  });
  return h('div', { class: 'chal' }, p, h('div', { class: 'row wrap' }, btn), fb);
}

/* --- MISJA: wstęp → eksperyment → zadania → podsumowanie --- */
Screens.mission = function (mi) {
  const mod = curMod(), m = mod.missions[mi], key = mKey(mod, m), diff = S.settings.difficulty;
  S.sessions++; persist();
  // zadania: obowiązkowe + losowane wg trudności + ewentualnie jedna pomyłka do powtórki
  const pool = mod.questions.filter(q => q.mission === m.id);
  const core = (m.core || []).map(id => mod.qIndex[id]);
  const tasks = core.concat(weightedPick(pool, Math.max(0, 4 - core.length), diff, new Set(m.core || []))).map(q => mat(q, diff));
  const due = dueMistakes(mod).find(x => x.mission === m.id && !tasks.some(t => t.id === x.id));
  if (due) { const alt = altFor(mod, due, diff); if (alt && !tasks.some(t => t.id === alt.id)) tasks[tasks.length - 1] = alt; }
  const steps = [...m.intro.map(x => ({ k: 'intro', x })), { k: 'exp' }, ...tasks.map((q, n) => ({ k: 'q', q, n })), { k: 'sum' }];
  const results = []; let idx = 0, expGoal = false;
  const app = $('#app');
  setCrumb(`Misja ${mi + 1} · ${m.title}`);
  function render() {
    cleanupScreen(); app.innerHTML = ''; window.scrollTo(0, 0);
    app.append(h('div', { class: 'stack' }, h('p', { class: 'eyebrow' }, `Misja ${mi + 1} · ${m.place}`), h('h1', {}, m.title), stepBar(steps.length, idx)));
    const box = h('section', { class: 'stack' }); app.append(box);
    const st = steps[idx];
    if (st.k === 'intro') {
      const first = idx === 0;
      box.append(say(st.x.text));
      if (st.x.anim) box.append(miniAnim(st.x.anim));
      box.append(h('div', { class: 'actions' },
        !first ? h('button', { class: 'btn ghost', type: 'button', onclick: () => { idx--; render(); } }, 'Wstecz') : null,
        first && S.done[key] ? h('button', { class: 'btn ghost', type: 'button', onclick: () => { idx = m.intro.length; render(); } }, 'Pomiń wstęp') : null,
        h('button', { class: 'btn primary', type: 'button', onclick: () => { idx++; render(); } }, 'Dalej')));
    } else if (st.k === 'exp') {
      const goalEl = h('p', { class: 'goal', hidden: true, role: 'status' });
      box.append(h('p', { class: 'eyebrow' }, 'Eksperyment'), h('h2', {}, m.expTitle), goalEl);
      const api = {
        goal(msg) {
          goalEl.hidden = false; goalEl.textContent = '✓ ' + msg;
          if (!expGoal) { expGoal = true; S.points += 5; checkBadges(); toast('+5 pkt za eksperyment'); Sound.play('good'); }
        }
      };
      mod.experiments[m.experiment](box, api);
      box.append(h('div', { class: 'actions' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { idx++; render(); } }, 'Przejdź do zadań')));
    } else if (st.k === 'q') {
      runQuestion(box, st.q, { label: `Zadanie ${st.n + 1} z ${tasks.length}`, onNext(r) { results.push(r); idx++; render(); } });
    } else summary(box);
  }
  function summary(box) {
    const pts = results.reduce((a, r) => a + r.points, 0) + (expGoal ? 5 : 0);
    const ratio = results.reduce((a, r) => a + r.points, 0) / (tasks.length * 10);
    const stars = ratio >= 0.85 ? 3 : ratio >= 0.5 ? 2 : 1;
    const firstTime = !S.done[key];
    S.done[key] = true; S.stars[key] = Math.max(S.stars[key] || 0, stars); persist(); checkBadges();
    Sound.play('done');
    const good = results.filter(r => r.ok).length;
    const msg = good === results.length ? 'Misja ukończona – wszystko dobrze!' : good >= results.length / 2 ? 'Misja ukończona! Większość zadań poszła dobrze.' : 'Misja ukończona! Trudniejsze zadania wrócą w powtórce – tak się uczy mózg.';
    const nxt = nextMission(mod);
    box.append(h('div', { class: 'card' },
      h('div', { class: 'bigstars', 'aria-label': `${stars} z 3 gwiazdek` }, [0, 1, 2].map(i => { const s = icon('star', true); if (i >= stars) s.classList.add('off'); return s; })),
      h('h2', { style: 'text-align:center' }, msg),
      h('p', { style: 'text-align:center' }, `Zdobyte punkty: +${pts}. Dobrze rozwiązane: ${good} z ${results.length}.`),
      h('div', { class: 'stack' }, h('p', { class: 'lbl' }, 'Co już wiesz:'), h('ul', {}, m.learned.map(l => h('li', {}, l))))),
      say(firstTime ? 'Dobra robota. Chcesz chwilę się przeciągnąć? 30 sekund przerwy pomaga w nauce.' : 'Każde powtórzenie utrwala wiedzę. Może krótka przerwa?'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn ghost', type: 'button', onclick: () => go('brk', nxt ? mod.missions.indexOf(nxt) : null) }, icon('heart'), 'Przerwa 30 s'),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => go('map') }, icon('map'), 'Mapa'),
        nxt ? h('button', { class: 'btn primary', type: 'button', onclick: () => go('mission', mod.missions.indexOf(nxt)) }, 'Następna misja') : null));
  }
  render();
};
