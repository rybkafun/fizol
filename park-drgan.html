function buildTest(mod, kind, diff) {
  const t = TESTS[kind];
  if (kind === 'mist') return Object.values(S.mistakes).filter(m => m.mod === mod.id).slice(0, 10).map(m => mod.qIndex[m.id] && mat(mod.qIndex[m.id], diff)).filter(Boolean);
  const out = [], used = new Set();
  dueMistakes(mod).slice(0, kind === 'quick' ? 2 : 3).forEach(m => { const q = altFor(mod, m, diff); if (q && !used.has(q.id)) { used.add(q.id); out.push(q); } });
  const gens = shuffle(mod.questions.filter(q => q.gen && !used.has(q.id)));
  gens.slice(0, Math.max(0, t.calc - out.filter(q => q.type === 'calc').length)).forEach(q => { used.add(q.id); out.push(mat(q, diff)); });
  const pool = mod.questions.filter(q => !q.gen && (!t.types || t.types.includes(q.type)));
  weightedPick(pool, t.n - out.length, diff, used).forEach(q => out.push(mat(q, diff)));
  return shuffle(out).slice(0, t.n);
}
Screens.test = function (kind, withTimer) {
  const mod = curMod(), t = TESTS[kind], app = $('#app'), diff = S.settings.difficulty;
  S.sessions++; persist();
  const items = buildTest(mod, kind, diff);
  if (!items.length) { go('mistakes'); return; }
  const results = []; let i = 0, left = withTimer ? t.timer : 0;
  const head = h('div', { class: 'stack' }), clock = h('span', { class: 'pill', role: 'timer' });
  const host = h('section', { class: 'stack' });
  app.append(head, host); setCrumb(t.title);
  if (withTimer) {
    const iv = setInterval(() => { left--; paintClock(); if (left <= 0) { clearInterval(iv); toast('Czas minął. Możesz spokojnie dokończyć – to tylko trening.', 'timer'); } }, 1000);
    onCleanup(() => clearInterval(iv));
  }
  function paintClock() { clock.textContent = left > 0 ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : 'czas minął – spokojnie kończ'; }
  function next() {
    head.innerHTML = ''; host.innerHTML = ''; window.scrollTo(0, 0);
    head.append(h('div', { class: 'row between wrap' }, h('h1', {}, t.title), withTimer ? clock : null), stepBar(items.length + 1, i));
    if (withTimer) paintClock();
    if (i >= items.length) return testSummary(host, kind, results);
    runQuestion(host, items[i], { label: `Pytanie ${i + 1} z ${items.length}`, onNext(r) { results.push(r); i++; next(); } });
  }
  next();
};
function testSummary(host, kind, results) {
  const mod = curMod();
  if (kind === 'kart') S.flags.kartkowka = true;
  if (kind === 'spr') S.flags.sprawdzian = true;
  persist(); checkBadges(); Sound.play('done');
  const by = {};
  results.forEach(r => { const c = r.q.concept; by[c] = by[c] || { ok: 0, n: 0 }; by[c].n++; if (r.ok) by[c].ok++; });
  const strong = Object.keys(by).filter(c => by[c].ok === by[c].n), review = Object.keys(by).filter(c => by[c].ok < by[c].n);
  const good = results.filter(r => r.ok).length, first = results.filter(r => r.firstTry).length, helped = results.filter(r => r.usedHelp).length;
  const pts = results.reduce((a, r) => a + r.points, 0);
  host.append(h('div', { class: 'card' },
    h('h2', {}, 'Gotowe! Oto twój postęp'),
    h('div', { class: 'stats' },
      h('div', { class: 'stat' }, h('b', {}, `${good}/${results.length}`), h('span', {}, 'zadań rozwiązanych dobrze')),
      h('div', { class: 'stat' }, h('b', {}, first), h('span', {}, 'za pierwszym razem')),
      h('div', { class: 'stat' }, h('b', {}, `+${pts}`), h('span', {}, 'punktów'))),
    strong.length ? h('div', { class: 'stack' }, h('p', { class: 'lbl' }, 'Mocne strony'), h('div', { class: 'chips-list' }, strong.map(c => h('span', { class: 'cchip good' }, mod.concepts[c] || c)))) : null,
    review.length ? h('div', { class: 'stack' }, h('p', { class: 'lbl' }, 'Do powtórki'), h('div', { class: 'chips-list' }, review.map(c => h('span', { class: 'cchip rev' }, mod.concepts[c] || c))),
      h('p', { class: 'small muted' }, 'Te tematy trafiły do „Moich pomyłek” i wrócą w powtórkach w nowej formie.')) : h('p', {}, 'Nie ma nic do powtórki. Świetna robota!'),
    helped ? h('p', { class: 'small' }, `Pomoc użyta ${helped} ${helped === 1 ? 'raz' : 'razy'}. Dobrze, że pytasz – tak się uczy.`) : null),
    h('div', { class: 'actions' },
      h('button', { class: 'btn ghost', type: 'button', onclick: () => go('cheat') }, icon('sheet'), 'Ściągawka'),
      review.length ? h('button', { class: 'btn ghost', type: 'button', onclick: () => go('mistakes') }, icon('redo'), 'Moje pomyłki') : null,
      h('button', { class: 'btn primary', type: 'button', onclick: () => go('map') }, 'Mapa')));
}

      tbody.prepend(h('tr', {}, h('td', {}, fmt(L, 2) + ' m'), h('td', {}, fmt(m, 2) + ' kg'), h('td', {}, A + '°'), h('td', {}, fmt(r.T, 2) + ' s')));
      if (!prev) return tip.set('Pierwszy pomiar zapisany. Zmień teraz jedną rzecz i zapisz znowu.');

        msg = { L: r.L > prev.L ? 'Dłuższa nić → dłuższy okres. Wahadło waha się wolniej.' : 'Krótsza nić → krótszy okres. Wahadło waha się szybciej.',
          m: 'Inna masa, a okres ten sam! Masa kulki nie zmienia okresu wahadła.',
          A: 'Inne wychylenie, a okres praktycznie ten sam (przy małych wychyleniach).' }[ch[0]];
        const left = ['L', 'm', 'A'].filter(x => !found.has(x)).map(x => ({ L: 'długość', m: 'masę', A: 'wychylenie' }[x]));
        if (left.length) msg += ' Sprawdź jeszcze: ' + left.join(', ') + '.';
      }
      tip.set(msg);
      if (found.size === 3) api.goal('Odkryłaś, co wpływa na okres wahadła, a co nie!');
    }
    host.append(tip, cv, out,
      sliderRow('labL', 'Długość nici', 0.2, 2, 0.05, L, v => fmt(v, 2) + ' m', v => { L = v; }),
      sliderRow('labM', 'Masa kulki', 0.05, 1, 0.05, m, v => fmt(v, 2) + ' kg', v => { m = v; }),
      sliderRow('labA', 'Wychylenie początkowe', 3, 15, 1, A, v => v + '°', v => { A = v; }),
      h('div', { class: 'row wrap' }, h('button', { class: 'btn primary', type: 'button', onclick: save }, 'Zapisz pomiar'), playToggle(st)),
      h('div', { class: 'tbl-wrap' }, h('table', {}, h('caption', { class: 'small muted', style: 'text-align:left' }, 'Notatnik pomiarów (najnowszy na górze)'),
        h('thead', {}, h('tr', {}, h('th', {}, 'Długość'), h('th', {}, 'Masa'), h('th', {}, 'Wychylenie'), h('th', {}, 'Okres'))), tbody)));
    let lastTxt = '';
    Loop.add(dt => {
      if (!st.paused) ph += dt * 2 * Math.PI / Tn();
      const { ctx, w, h: H } = fit(cv), px = w / 2, py = 26, len = 20 + (H - 70) * (L / 2), a = A * Math.PI / 180;
      drawCeiling(ctx, px, py, 140);
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.arc(px, py, len, Math.PI / 2 - a, Math.PI / 2 + a); ctx.stroke(); ctx.setLineDash([]);
      drawPendulum(ctx, px, py, len, a * Math.cos(ph), 8 + 10 * Math.cbrt(m));
      const s = `Okres T ≈ ${fmt(Tn(), 2)} s  ·  Częstotliwość f ≈ ${fmt(1 / Tn(), 2)} Hz`;
      if (s !== lastTxt) { out.textContent = s; lastTxt = s; }

  },

  /* Misja 4: trampolina-sprężyna – masa i sztywność */
  spring(host, api) {
    let m = 0.4, k = 30, ph = 0, slow = false; const st = { paused: !animOn() }, rows = [], found = new Set();
    const cv = h('canvas', { class: 'sim', role: 'img', 'aria-label': 'Ciężarek drgający na sprężynie' });
    const out = h('p', { class: 'readout' });
    const tip = say('Zmień masę albo sztywność sprężyny i zapisz pomiar. Patrz, jak zmienia się okres.');
    const tbody = h('tbody');
    const Tn = () => periodSpring(m, k);
    const bSlow = h('button', { class: 'toggle', type: 'button', 'aria-pressed': 'false' }, 'Zwolnione tempo ×4');
    bSlow.addEventListener('click', () => { slow = !slow; bSlow.setAttribute('aria-pressed', String(slow)); });
    function save() {
      const r = { m, k, T: Tn() }, prev = rows[rows.length - 1]; rows.push(r);
      S.measurements++; persist(); checkBadges();
      tbody.prepend(h('tr', {}, h('td', {}, fmt(m, 2) + ' kg'), h('td', {}, k + ' N/m'), h('td', {}, fmt(r.T, 2) + ' s')));
      if (!prev) return tip.set('Zapisane. Zmień jedną rzecz i zapisz znowu.');
      const dm = Math.abs(r.m - prev.m) > 1e-9, dk = r.k !== prev.k;
      if (dm && dk) return tip.set('Zmieniłaś dwie rzeczy naraz. Zmieniaj jedną – wtedy widać, co działa.');
      if (!dm && !dk) return tip.set('Te same ustawienia. Zmień masę albo sprężynę.');
      if (dm) { found.add('m'); tip.set(r.m > prev.m ? 'Większa masa → dłuższy okres. Ciężarek drga wolniej.' : 'Mniejsza masa → krótszy okres. Ciężarek drga szybciej.'); }
      else { found.add('k'); tip.set(r.k > prev.k ? 'Sztywniejsza sprężyna → krótszy okres. Drgania szybsze.' : 'Miększa sprężyna → dłuższy okres. Drgania wolniejsze.'); }
      if (found.size === 2) api.goal('Wiesz już, jak masa i sztywność sprężyny wpływają na okres!');
    }
    host.append(tip, cv, out,
      sliderRow('sprM', 'Masa ciężarka', 0.1, 1, 0.05, m, v => fmt(v, 2) + ' kg', v => { m = v; }),
      sliderRow('sprK', 'Sztywność sprężyny', 10, 60, 5, k, v => v + ' N/m' + (v <= 20 ? ' (miękka)' : v >= 45 ? ' (sztywna)' : ''), v => { k = v; }),
      h('div', { class: 'row wrap' }, h('button', { class: 'btn primary', type: 'button', onclick: save }, 'Zapisz pomiar'), playToggle(st), bSlow),
      h('div', { class: 'tbl-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Masa'), h('th', {}, 'Sztywność'), h('th', {}, 'Okres'))), tbody)),
      h('p', { class: 'small muted' }, 'Sztywność mówi, jak mocno sprężyna się opiera: N/m to niutony na każdy metr rozciągnięcia.'));
    let lastTxt = '';
    Loop.add(dt => {
      if (!st.paused) ph += dt * (slow ? 0.25 : 1) * 2 * Math.PI / Tn();
      const { ctx, w, h: H } = fit(cv); drawSpringScene(ctx, w, H, m, k, Math.cos(ph));
      const s = `Okres T ≈ ${fmt(Tn(), 2)} s  ·  Częstotliwość f ≈ ${fmt(1 / Tn(), 2)} Hz`;
      if (s !== lastTxt) { out.textContent = s; lastTxt = s; }
    }, cv);
  },

  /* Misja 5: energia – paski Ep i Ek zmieniające się w czasie */
  energy(host, api) {
    const L = 1, T = periodPendulum(L), th0 = 0.55, st = { paused: !animOn() };
    let t = 0, frozen = false, slow = false;
    const cv = h('canvas', { class: 'sim', role: 'img', 'aria-label': 'Wahadło z zaznaczoną prędkością kulki' });
    const bar = (label, color) => { const f = h('div', { class: 'fill', style: `background:${color};width:0%` }), o = h('output', {}, '0%'); return { el: h('div', { class: 'ebar' }, h('span', { class: 'lbl' }, label), h('div', { class: 'track' }, f), o), f, o }; };
    const bEp = bar('Energia potencjalna', 'var(--lilac)'), bEk = bar('Energia kinetyczna', 'var(--accent)'), bE = bar('Razem', 'var(--primary)');
    const bSlow = h('button', { class: 'toggle', type: 'button', 'aria-pressed': 'false' }, 'Zwolnione tempo');
    bSlow.addEventListener('click', () => { slow = !slow; bSlow.setAttribute('aria-pressed', String(slow)); });
    const ratio = () => Math.abs(Math.cos(2 * Math.PI * t / T));
    host.append(say('Obserwuj paski: suma energii się nie zmienia, zmienia się tylko jej forma.'), cv,
      h('div', { class: 'stack', style: 'gap:.5rem' }, bEp.el, bEk.el, bE.el),
      h('div', { class: 'row wrap' }, playToggle(st), bSlow),
      stopChallenge({
        freeze: v => { frozen = v; }, ratio,
        tasks: [
          { text: 'Wyzwanie 1 z 2: zatrzymaj wahadło, gdy energia kinetyczna jest największa.', test: r => r < 0.25, ok: 'Tak! W położeniu równowagi kulka jest najszybsza – Ek największa.', miss: () => 'Spójrz na pomarańczowy pasek – ma być prawie pełny.' },
          { text: 'Wyzwanie 2 z 2: zatrzymaj wahadło, gdy energia potencjalna jest największa.', test: r => r > 0.9, ok: 'Świetnie! W skrajnym położeniu kulka jest najwyżej i na chwilę staje.', miss: () => 'Fioletowy pasek ma być prawie pełny – czekaj na skrajne położenie.' }
        ],
        onDone: () => api.goal('Wiesz, gdzie której energii jest najwięcej!')
      }));
    Loop.add(dt => {
      if (!frozen && !st.paused) t += dt * (slow ? 0.35 : 1);
      const ph = 2 * Math.PI * t / T, th = th0 * Math.cos(ph), om = -th0 * Math.sin(ph);
      const ep = (1 - Math.cos(th)) / (1 - Math.cos(th0)), ek = Math.max(0, 1 - ep);
      [[bEp, ep], [bEk, ek], [bE, 1]].forEach(([b, v]) => { b.f.style.width = (v * 100).toFixed(1) + '%'; b.o.textContent = Math.round(v * 100) + '%'; });
      const { ctx, w, h: H } = fit(cv), px = w / 2, py = 26, len = H - 66;
      drawCeiling(ctx, px, py, 140);
      dash(ctx, px - len * Math.sin(th0) - 30, py + len * Math.cos(th0), px + len * Math.sin(th0) + 30, py + len * Math.cos(th0), COL.line, 1);
      dash(ctx, px - 60, py + len, px + 60, py + len, COL.line, 1);
      const b = drawPendulum(ctx, px, py, len, th, 14);
      const v = om * 60; if (Math.abs(v) > 3) arrow(ctx, b.x, b.y, b.x + v * Math.cos(th), b.y - v * Math.sin(th), COL.accent, false, 3);
      txt(ctx, 'strzałka = prędkość kulki', px, H - 10, { size: 12, color: COL.muted, weight: 400 });
    }, cv);
  },

  /* Misja 6: rezonans (pchanie huśtawki) i tłumienie (opór powietrza) */
  damp(host, api) {
    const tabs = h('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Części eksperymentu' });
    const pA = h('div', { class: 'stack', role: 'tabpanel', id: 'panRes' }), pB = h('div', { class: 'stack', role: 'tabpanel', id: 'panDamp', hidden: true });
    const tA = h('button', { role: 'tab', type: 'button', 'aria-selected': 'true', 'aria-controls': 'panRes' }, 'Rezonans: huśtawka');
    const tB = h('button', { role: 'tab', type: 'button', 'aria-selected': 'false', 'aria-controls': 'panDamp' }, 'Tłumienie: wahadło');
    const sel = a => { tA.setAttribute('aria-selected', String(a)); tB.setAttribute('aria-selected', String(!a)); pA.hidden = !a; pB.hidden = a; };
    tA.addEventListener('click', () => sel(true)); tB.addEventListener('click', () => sel(false));
    tabs.append(tA, tB); host.append(tabs, pA, pB);
    let resDone = false, dampSeen = false;
    const maybeGoal = () => { if (resDone && dampSeen) api.goal('Znasz już rezonans i tłumienie!'); };

    // --- rezonans: równanie ruchu θ'' = −ω0²θ − 2βθ', pchnięcie dodaje prędkość do przodu
    const w0 = 2 * Math.PI / 2.4, beta = 0.06, target = 0.44;
    let th = 0.05, om = 0, pushes = 0, flash = 0, showRhythm = true;
    const cvA = h('canvas', { class: 'sim', role: 'img', 'aria-label': 'Huśtawka, którą rozkołysujesz pchnięciami' });
    const fbA = h('p', { 'aria-live': 'polite' }, 'Stoisz po lewej stronie. Pchaj huśtawkę, gdy odchyla się od ciebie.');
    const meter = h('div', { class: 'progress', style: 'height:16px' }, h('i', { style: 'width:0%;background:var(--accent)' }));
    const bPush = h('button', { class: 'btn primary big', type: 'button' }, 'Pchnij!');
    const bRh = h('button', { class: 'toggle', type: 'button', 'aria-pressed': 'true' }, 'Podpowiedź rytmu');
    bRh.addEventListener('click', () => { showRhythm = !showRhythm; bRh.setAttribute('aria-pressed', String(showRhythm)); });
    function push() {
      pushes++; flash = 0.35; Sound.play('push');
      if (Math.abs(om) < 0.3 && th < 0) fbA.textContent = 'Idealny moment! Huśtawka właśnie zawracała.';
      else if (om > 0) fbA.textContent = 'Dobre pchnięcie – huśtawka leciała od ciebie.';
      else fbA.textContent = 'Huśtawka leciała w twoją stronę – pchnięcie ją przyhamowało. Poczekaj na dobry moment.';
      om += 0.2;
    }
    bPush.addEventListener('click', push);
    onKey(e => { if (!pA.hidden && (e.key === 'p' || e.key === 'P') && !isTyping(e)) push(); }, cvA);
    pA.append(say('Rezonans: małe pchnięcia w rytmie huśtawki dają duże wychylenie.'), cvA,
      h('div', { class: 'stack', style: 'gap:.3rem' }, h('span', { class: 'small muted' }, 'Wychylenie (cel: kreska na końcu paska)'), meter),
      h('div', { class: 'row wrap' }, bPush, bRh), fbA, h('p', { class: 'small muted' }, 'Skrót klawiszowy: P – pchnij.'));
    Loop.add(dt => {
      if (!pA.hidden) {
        for (let i = 0; i < 4; i++) { const d = dt / 4, a = -w0 * w0 * th - 2 * beta * om; om += a * d; th += om * d; }
        let amp = Math.hypot(th, om / w0); if (amp > 0.9) { th *= 0.9 / amp; om *= 0.9 / amp; amp = 0.9; }
        meter.firstChild.style.width = Math.min(100, amp / target * 100).toFixed(1) + '%';
        if (!resDone && amp >= target) { resDone = true; S.flags.rezonans = true; persist(); checkBadges(); fbA.textContent = `Udało się po ${pushes} pchnięciach! Pchałaś w rytmie drgań własnych huśtawki – to rezonans.`; maybeGoal(); }
        flash = Math.max(0, flash - dt);
      }
      const { ctx, w, h: H } = fit(cvA), px = w / 2, py = 28, len = H - 90;
      const seat = drawSwing(ctx, px, py, len, th, H - 16);
      if (showRhythm && th < -0.03 && Math.abs(om) < 0.35) { ctx.fillStyle = COL.ok; ctx.beginPath(); ctx.arc(seat.x - 42, seat.y - 4, 9, 0, Math.PI * 2); ctx.fill(); txt(ctx, 'teraz!', seat.x - 42, seat.y - 24, { size: 13, color: COL.ok }); }
      if (flash > 0) arrow(ctx, seat.x - 58, seat.y, seat.x - 32, seat.y, COL.accent, false, 5);
    }, cvA);

    // --- tłumienie: θ = θ0·e^(−βt)·cos(ωt), wykres wychylenia z obwiednią
    let tb = 0, bD = 0.15; const hist = [];
    const cvB = h('canvas', { class: 'sim mini', role: 'img', 'aria-label': 'Wahadło z oporem powietrza' });
    const cvG = h('canvas', { class: 'sim mini', role: 'img', 'aria-label': 'Wykres wychylenia wahadła od czasu' });
    pB.append(say('Drgania tłumione: amplituda maleje, a energia zamienia się w energię wewnętrzną powietrza i zawieszenia.'), cvB,
      sliderRow('dampB', 'Opór powietrza', 0, 0.6, 0.05, bD, v => v === 0 ? 'brak (idealnie)' : v < 0.2 ? 'mały' : v < 0.4 ? 'średni' : 'duży', v => { bD = v; tb = 0; hist.length = 0; dampSeen = true; maybeGoal(); }),
      h('div', { class: 'row wrap' }, h('button', { class: 'btn ghost', type: 'button', onclick: () => { tb = 0; hist.length = 0; } }, 'Puść wahadło jeszcze raz')),
      cvG, h('p', { class: 'small muted' }, 'Zwróć uwagę: odstępy między szczytami (okres) prawie się nie zmieniają.'));
    tB.addEventListener('click', () => { setTimeout(() => { dampSeen = true; maybeGoal(); }, 8000); });
    const wD = Math.sqrt(G / 1), A0 = 0.5;
    Loop.add(dt => {
      if (pB.hidden) return;
      if (animOn()) { tb += dt; hist.push([tb, A0 * Math.exp(-bD * tb) * Math.cos(wD * tb)]); while (hist.length && hist[0][0] < tb - 14) hist.shift(); }
      const thb = A0 * Math.exp(-bD * tb) * Math.cos(wD * tb);
      let { ctx, w, h: H } = fit(cvB);
      drawCeiling(ctx, w / 2, 24, 120); drawPendulum(ctx, w / 2, 24, H - 60, thb, 13);
      ({ ctx, w, h: H } = fit(cvG));
      const x0 = 30, y0 = H / 2, sx = (w - x0 - 10) / 14, sy = (H / 2 - 14) / A0, tStart = Math.max(0, tb - 14);
      ctx.strokeStyle = COL.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x0, 8); ctx.lineTo(x0, H - 8); ctx.moveTo(x0, y0); ctx.lineTo(w - 6, y0); ctx.stroke();
      txt(ctx, 'x', x0 - 14, 14, {}); txt(ctx, 't', w - 12, y0 + 14, {});
      ctx.save(); ctx.setLineDash([4, 5]); ctx.strokeStyle = COL.lilac; ctx.lineWidth = 1.5;
      [1, -1].forEach(sg => { ctx.beginPath(); for (let i = 0; i <= 14; i += 0.25) { const tt = tStart + i; ctx.lineTo(x0 + i * sx, y0 - sg * A0 * Math.exp(-bD * tt) * sy); } ctx.stroke(); });
      ctx.restore();
      ctx.strokeStyle = COL.primary; ctx.lineWidth = 2.5; ctx.beginPath();
      hist.forEach(([tt, v], i) => { const X = x0 + (tt - tStart) * sx, Y = y0 - v * sy; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.stroke();
    }, cvB);
  }
};

(function boot() {
  $('#btnHome').append(icon('map'));
  $('#btnSettings').append(icon('gear'));
  $('#btnHome').addEventListener('click', () => go('map'));
  $('#btnSettings').addEventListener('click', openSettings);
  $('#btnSound').addEventListener('click', () => { S.settings.sound = !S.settings.sound; persist(); updateHUD(); Sound.play('ok'); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#overlay').hidden) { closeOverlay(); return; }
    if (!$('#overlay').hidden) return;
    for (const it of [...Keys]) { if (it.el && !it.el.isConnected) { Keys.delete(it); continue; } it.fn(e); }
  });
  // Kolory canvasa nadążają za motywem (systemowym i ustawionym przez stronę)
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) { }
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-contrast'] });
  streakMsg = updateStreak();
  applySettings();
  checkBadges();
  go('map');
})();
